apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    bundleAssetName = "index.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    entryFile = file("../../index.ts")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release keystore is not in git (*.keystore). Optional android/keystore.properties overrides path/passwords.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseKeystoreFile = keystoreProperties['storeFile']
        ? rootProject.file(keystoreProperties['storeFile'])
        : file('todaymall.keystore')
def hasReleaseKeystore = releaseKeystoreFile.exists()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.todayggigu.kr"
    
    // Disable lint to avoid file locking issues
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage'
    }
    defaultConfig {
        applicationId "com.todayggigu.kr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        resConfigs "ko", "en", "zh"
    }
    signingConfigs {
        debug {
            def debugKeystore = file('debug.keystore')
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (hasReleaseKeystore) {
            release {
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword'] ?: '123456'
                keyAlias keystoreProperties['keyAlias'] ?: 'todaymall_alias'
                keyPassword keystoreProperties['keyPassword'] ?: '123456'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                println('\n[TodayGgigu] WARNING: Release keystore not found at: ' + releaseKeystoreFile.absolutePath)
                println('[TodayGgigu] Copy todaymall.keystore to android/app/ or set storeFile in android/keystore.properties')
                println('[TodayGgigu] Falling back to DEBUG signing — not valid for Play Store upload.\n')
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true // Enable resource shrinking
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Additional optimizations
            zipAlignEnabled true
            debuggable false
            // Remove debug symbols
            ndk {
                debugSymbolLevel 'NONE'
            }
            // Disable lint for release to avoid file locking issues
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
        }
    }
    
    // Split APKs by ABI to reduce individual APK size
    // Note: Disable splits when building Android App Bundles (AAB)
    // Bundles already handle multiple architectures internally
    // Check if building a bundle by examining task names
    def taskNames = gradle.startParameter.taskNames
    def isBundleBuild = taskNames.any { taskName ->
        taskName.toLowerCase().contains("bundle")
    }
    
    if (!isBundleBuild) {
        // Only enable splits for APK builds, not bundle builds
        splits {
            abi {
                reset()
                enable true
                universalApk true
                include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
        defaultConfig.ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    } else {
        // For bundle builds, exclude emulator-only architectures
        defaultConfig.ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    
    // Configure APK naming - fixed for split APKs
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Only set output file name for APK outputs, not bundle outputs
            if (output.outputFile != null && output.outputFile.name.endsWith('.apk')) {
                def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                def abiName = abiFilter != null ? abiFilter : "universal"
                output.outputFileName = "todaymall-${variant.versionName}-${abiName}-${variant.buildType.name}.apk"
            }
        }
    }
    
    // Additional size optimizations
    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/*.version'
    }
    
    // Resource filtering to exclude unused resources
    aaptOptions {
        noCompress 'tflite'
        noCompress 'lite'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
